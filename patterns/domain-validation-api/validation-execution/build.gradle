/*
 * Validation Execution: the reusable asynchronous execution of validations, as a Spring Boot starter.
 * The version comes from gradle.properties; CI replaces it with the calculated next version.
 */
plugins {
    id 'java-library'
    id 'jacoco'
    alias(libs.plugins.pitest.sedr)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

// The Spring Boot BOM as a Gradle platform, exported to the projects that use the starter.
// Kafka is optional: the starter publishes to it only when the bounded context has Kafka and turns it on.
dependencies {
    api platform(libs.spring.boot.dependencies.sedr)
    api libs.spring.boot.starter.webmvc.sedr
    compileOnly libs.spring.kafka.sedr
}

testing {
    suites {
        // Unit tests: one class at a time, everything outside it mocked; never a Spring context.
        test {
            useJUnitJupiter(libs.versions.junit.sedr.get())
            dependencies {
                // A request for ValidationExecution to answer, without a Spring context.
                implementation libs.spring.test.sedr
                // The Kafka publisher and its auto-configuration, which the starter only compiles against,
                // and a mock of the KafkaOperations the publisher sends with.
                implementation libs.spring.kafka.sedr
                implementation libs.mockito.core.sedr
            }
        }

        // Component tests: one component with everything outside it mocked; never a Spring context.
        testComponent(JvmTestSuite) {
            useJUnitJupiter(libs.versions.junit.sedr.get())
            dependencies {
                implementation project()
            }
            targets.configureEach {
                testTask.configure {
                    shouldRunAfter(test)
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn testing.suites.testComponent
}

// Mockito instruments classes with its own agent, attached at start-up rather than at run time,
// which the JDK warns about and will refuse.
configurations {
    mockitoAgent
}

dependencies {
    mockitoAgent platform(libs.spring.boot.dependencies.sedr)
    mockitoAgent(libs.mockito.core.sedr) {
        transitive = false
    }
}

def mockitoAgentPath = configurations.mockitoAgent.elements.map { it.first().asFile.absolutePath }

tasks.named('test', Test) {
    jvmArgumentProviders.add(new MockitoAgent(path: mockitoAgentPath))
}

class MockitoAgent implements CommandLineArgumentProvider {
    @Internal
    Provider<String> path

    @Override
    Iterable<String> asArguments() {
        ["-javaagent:${path.get()}".toString()]
    }
}

// Coverage: 100% of the project's own code, measured on the unit tests alone.
tasks.named('test') {
    finalizedBy 'jacocoTestReport'
}

tasks.named('jacocoTestReport') {
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    violationRules {
        rule {
            ['INSTRUCTION', 'BRANCH', 'LINE', 'METHOD', 'CLASS'].each { measured ->
                limit {
                    counter = measured
                    minimum = 1.0
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn 'jacocoTestCoverageVerification'
}

// Mutation testing: every mutant of the project's own code must be killed by a unit test, so that a
// test which runs code without checking its result fails the build. Coverage shows what the unit tests
// run; the mutation score shows what they verify.
pitest {
    pitestVersion = libs.versions.pitest.sedr.get()
    junit5PluginVersion = libs.versions.pitest.junit5.sedr.get()
    targetClasses = ['com.arc_e_tect.validation.async.*']
    jvmArgs = mockitoAgentPath.map { ["-javaagent:${it}".toString()] }
    testSourceSets = [sourceSets.test]
    mutators = ['STRONGER']
    mutationThreshold = 100
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
}

tasks.named('check') {
    dependsOn 'pitest'
}
