# Versions are kept up to date with `./gradlew refreshVersions`; every alias carries the suffix -sedr.

[versions]

junit-sedr = "6.1.3"
pitest-sedr = "1.30.2"
pitest-junit5-sedr = "1.2.3"
pitest-plugin-sedr = "1.19.0"
architecture-validator-sedr = "4.1.0"
hexagonal-spring-rules-sedr = "1.0.5"
domain-validation-rules-sedr = "0.0.2"
spring-boot-sedr = "4.1.2"
api-only-subscriber-sedr = "0.4.5"
openapi-generator-sedr = "7.27.0"
cucumber-sedr = "8.0.4"
wiremock-sedr = "3.13.2"
api-only-transcriberj-sedr = "0.18.0"
api-only-transcriberj-restdocs-sedr = "0.5.0"
api-only-transcriberj-microcks-sedr = "2.0.0"

[libraries]

hexagonal-spring-rules-sedr = { module = "com.arc-e-tect.architecture-validator:architecture-validator-hexagonal-spring-rules", version.ref = "hexagonal-spring-rules-sedr" }
domain-validation-rules-sedr = { module = "com.arc-e-tect.architecture-validator:architecture-validator-domain-validation-rules", version.ref = "domain-validation-rules-sedr" }

# Managed by the Spring Boot BOM: no version.
spring-boot-starter-webmvc-sedr = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-validation-sedr = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-test-sedr = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-test-sedr = { module = "org.springframework:spring-test" }
mockito-core-sedr = { module = "org.mockito:mockito-core" }
junit-platform-suite-sedr = { module = "org.junit.platform:junit-platform-suite" }
spring-boot-starter-kafka-sedr = { module = "org.springframework.boot:spring-boot-starter-kafka" }
spring-boot-testcontainers-sedr = { module = "org.springframework.boot:spring-boot-testcontainers" }
testcontainers-kafka-sedr = { module = "org.testcontainers:testcontainers-kafka" }

api-only-transcriberj-restdocs-sedr = { module = "com.arc-e-tect:api-only-transcriberj-restdocs", version.ref = "api-only-transcriberj-restdocs-sedr" }
api-only-transcriberj-microcks-sedr = { module = "com.arc-e-tect:api-only-transcriberj-microcks", version.ref = "api-only-transcriberj-microcks-sedr" }
spring-restdocs-webtestclient-sedr = { module = "org.springframework.restdocs:spring-restdocs-webtestclient" }

wiremock-standalone-sedr = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock-sedr" }

cucumber-java-sedr = { module = "io.cucumber:cucumber-java", version.ref = "cucumber-sedr" }
cucumber-spring-sedr = { module = "io.cucumber:cucumber-spring", version.ref = "cucumber-sedr" }
cucumber-junit-platform-engine-sedr = { module = "io.cucumber:cucumber-junit-platform-engine", version.ref = "cucumber-sedr" }

# The starter of this repository, included as a build: no version.
validation-execution-sedr = { module = "com.arc-e-tect.patterns:validation-execution" }

[bundles]

cucumber-sedr = ["cucumber-java-sedr", "cucumber-spring-sedr", "cucumber-junit-platform-engine-sedr", "junit-platform-suite-sedr"]

[plugins]

pitest-sedr = { id = "info.solidsoft.pitest", version.ref = "pitest-plugin-sedr" }
architecture-validator-sedr = { id = "com.arc-e-tect.architecture-validator", version.ref = "architecture-validator-sedr" }
spring-boot-sedr = { id = "org.springframework.boot", version.ref = "spring-boot-sedr" }
api-only-subscriber-sedr = { id = "com.arc-e-tect.api-only-subscriber", version.ref = "api-only-subscriber-sedr" }
api-only-transcriberj-sedr = { id = "com.arc-e-tect.api-only-transcriberj", version.ref = "api-only-transcriberj-sedr" }
openapi-generator-sedr = { id = "org.openapi.generator", version.ref = "openapi-generator-sedr" }
