# Versions are kept up to date with `./gradlew refreshVersions`; every alias carries the suffix -sedr.

[versions]

junit-sedr = "6.1.3"
pitest-sedr = "1.30.2"
pitest-junit5-sedr = "1.2.3"
pitest-plugin-sedr = "1.19.0"
architecture-validator-sedr = "4.1.0"
hexagonal-spring-rules-sedr = "1.0.5"

[libraries]

hexagonal-spring-rules-sedr = { module = "com.arc-e-tect.architecture-validator:architecture-validator-hexagonal-spring-rules", version.ref = "hexagonal-spring-rules-sedr" }

[plugins]

pitest-sedr = { id = "info.solidsoft.pitest", version.ref = "pitest-plugin-sedr" }
architecture-validator-sedr = { id = "com.arc-e-tect.architecture-validator", version.ref = "architecture-validator-sedr" }
