/*
 * Domain Validation API reference implementation: the payments service with the name-iban-match validation.
 * The version comes from gradle.properties; CI replaces it with the calculated next version.
 */
plugins {
    id 'java'
    id 'jacoco'
    alias(libs.plugins.pitest.sedr)
    alias(libs.plugins.architecture.validator.sedr)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

testing {
    suites {
        // Unit tests: one class at a time, everything outside it mocked; never a Spring context.
        test {
            useJUnitJupiter(libs.versions.junit.sedr.get())
        }

        // Component tests: one component with everything outside it mocked; never a Spring context.
        testComponent(JvmTestSuite) {
            useJUnitJupiter(libs.versions.junit.sedr.get())
            dependencies {
                implementation project()
            }
            targets.configureEach {
                testTask.configure {
                    shouldRunAfter(test)
                }
            }
        }

        // Contract tests: the running service against the subscribed contract, from the TranscriberJ's
        // generated classes.
        testContract(JvmTestSuite) {
            useJUnitJupiter(libs.versions.junit.sedr.get())
            dependencies {
                implementation project()
            }
            targets.configureEach {
                testTask.configure {
                    shouldRunAfter(testComponent)
                }
            }
        }

        // System tests: the BDD features, one per API operation, against the running service.
        testSystem(JvmTestSuite) {
            useJUnitJupiter(libs.versions.junit.sedr.get())
            dependencies {
                implementation project()
            }
            targets.configureEach {
                testTask.configure {
                    shouldRunAfter(testContract)
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn testing.suites.testComponent, testing.suites.testContract, testing.suites.testSystem
}

// Coverage: 100% of the project's own code, measured on the unit tests alone. Generated code is
// excluded once it exists; nothing else is.
tasks.named('test') {
    finalizedBy 'jacocoTestReport'
}

tasks.named('jacocoTestReport') {
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    violationRules {
        rule {
            ['INSTRUCTION', 'BRANCH', 'LINE', 'METHOD', 'CLASS'].each { measured ->
                limit {
                    counter = measured
                    minimum = 1.0
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn 'jacocoTestCoverageVerification'
}

// Mutation testing: every mutant of the project's own code must be killed by a unit test, so that a
// test which runs code without checking its result fails the build. Coverage shows what the unit tests
// run; the mutation score shows what they verify.
pitest {
    pitestVersion = libs.versions.pitest.sedr.get()
    junit5PluginVersion = libs.versions.pitest.junit5.sedr.get()
    targetClasses = ['com.arc_e_tect.payments.*']
    testSourceSets = [sourceSets.test]
    mutators = ['STRONGER']
    mutationThreshold = 100
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
}

tasks.named('check') {
    dependsOn 'pitest'
}

// Architecture: the Architecture Validator's built-in Hexagonal rules and the Spring rule pack.
// The Domain Validation API rule pack joins them once it is published.
architectureValidator {
    basePackage = 'com.arc_e_tect.payments'
    junitVersion = libs.versions.junit.sedr.get()
    hexagonalArchitecture {
        // The verdict model every validation shares is domain model too, so the built-in rules guard it.
        domainModel = ['..application.domain.model..', '..validation.verdict..']
        // java.text for java.text.Normalizer, which strips diacritics when names are compared.
        domainAllowedPackages = ['java.lang..', 'java.time..', 'java.util..', 'java.math..', 'java.text..']
        namingConventionsEnabled = true
    }
}

dependencies {
    testArchitectureImplementation libs.hexagonal.spring.rules.sedr
}

tasks.named('check') {
    dependsOn 'testArchitecture'
}
