/*
 * Domain Validation API reference implementation: the payments service with the name-iban-match validation.
 * The version comes from gradle.properties; CI replaces it with the calculated next version.
 */
plugins {
    id 'java'
    id 'jacoco'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

testing {
    suites {
        // Unit tests: one class at a time, everything outside it mocked; never a Spring context.
        test {
            useJUnitJupiter(libs.versions.junit.sedr.get())
        }

        // Component tests: one component with everything outside it mocked; never a Spring context.
        testComponent(JvmTestSuite) {
            useJUnitJupiter(libs.versions.junit.sedr.get())
            dependencies {
                implementation project()
            }
            targets.configureEach {
                testTask.configure {
                    shouldRunAfter(test)
                }
            }
        }

        // Contract tests: the running service against the subscribed contract, from the TranscriberJ's
        // generated classes.
        testContract(JvmTestSuite) {
            useJUnitJupiter(libs.versions.junit.sedr.get())
            dependencies {
                implementation project()
            }
            targets.configureEach {
                testTask.configure {
                    shouldRunAfter(testComponent)
                }
            }
        }

        // System tests: the BDD features, one per API operation, against the running service.
        testSystem(JvmTestSuite) {
            useJUnitJupiter(libs.versions.junit.sedr.get())
            dependencies {
                implementation project()
            }
            targets.configureEach {
                testTask.configure {
                    shouldRunAfter(testContract)
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn testing.suites.testComponent, testing.suites.testContract, testing.suites.testSystem
}

// Coverage: 100% of the project's own code, measured on the unit tests alone. Generated code is
// excluded once it exists; nothing else is.
tasks.named('test') {
    finalizedBy 'jacocoTestReport'
}

tasks.named('jacocoTestReport') {
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    violationRules {
        rule {
            ['INSTRUCTION', 'BRANCH', 'LINE', 'METHOD', 'CLASS'].each { measured ->
                limit {
                    counter = measured
                    minimum = 1.0
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn 'jacocoTestCoverageVerification'
}
