spring:
  application:
    name: payments
  mvc:
    # Errors are answered as RFC 9457 Problem Details, application/problem+json.
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      # A request body with a member the contract does not declare breaks the contract.
      fail-on-unknown-properties: true

# Once a job has run, the validation-execution starter tells so: it posts the contract's
# ValidationCompletedEventV1 to the webhook's subscribers, none by default, and sends it to the topic
# when Kafka is turned on, with spring.kafka.bootstrap-servers pointing at the broker.
validation:
  execution:
    events:
      webhook:
        subscribers: []
      kafka:
        enabled: false
        topic: payments.validation.completed.v1

payments:
  validation:
    name-iban-match:
      # The countries whose accounts the payee verification scheme covers.
      supported-countries: [NL, BE, DE]
      # The simulated payee verification scheme, with the accounts of the contract's examples.
      scheme:
        timeout: 2s
        accounts:
          - iban: NL91ABNA0417164300
            registered-name: Jan de Vries
          # The scheme cannot answer for this account: the verdict is indeterminate.
          - iban: NL20INGB0001234567
            registered-name: Anna Bakker
            available: false
          # The scheme answers for this account after the timeout: the verdict is indeterminate.
          - iban: DE89370400440532013000
            registered-name: Anna Schmidt
            response-time: 5s
