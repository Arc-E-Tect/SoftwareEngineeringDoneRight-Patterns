name: API - Build
on:
  push:
    branches-ignore:
      - main
      - maintenance
    paths:
      - 'api/**'
      - '.github/workflows/api-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Build-API:
    name: Build API
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check compares every target with its version at the merge-base with main.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install the API-Only Publisher
        run: npm ci

      - name: Build
        run: npm run apionly -- build

      - name: Lint
        run: npm run apionly -- lint

      - name: Check versions
        run: npm run apionly -- check

      - name: Publish to the file channel
        run: npm run apionly -- publish --channel file

      - name: Upload the built contracts and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-build
          path: |
            api/build/dist/**
            api/build/reports/**
            api/build/publish/**
